name: Build E9Studio

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'test/unit/**'
      - 'tool/**'
      - 'Makefile.e9studio'
      - 'Makefile.cosmo'
      - '.github/workflows/build-e9studio.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  release:
    types: [ created ]

permissions:
  contents: read

jobs:
  # One APE build; the same files are then run on Linux, macOS and Windows.
  build-ape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cosmocc toolchain
        uses: actions/cache@v4
        with:
          path: .cosmocc
          # tool/cosmocc.mk holds the pinned version + sha256
          key: cosmocc-${{ hashFiles('tool/cosmocc.mk') }}

      - name: Install pinned cosmocc (sha256-verified)
        run: make -f Makefile.e9studio toolchain

      - name: Build and check (unit tests, --self-test, vendor tests)
        run: make -f Makefile.e9studio -j"$(nproc)" check

      - name: Upload APE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e9studio-ape
          path: |
            build/e9studio.com
            build/unit/*.com

  run-ape:
    needs: build-ape
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Download APE artifacts
        uses: actions/download-artifact@v4
        with:
          name: e9studio-ape

      - name: Run unit tests and self-test
        run: |
          set -e
          chmod +x e9studio.com unit/*.com || true
          for t in unit/*.com; do echo "== $t"; ./"$t"; done
          ./e9studio.com --self-test

  # Host-compiler build for fast feedback (not an APE, no ZipOS)
  test-native-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and check (native gcc)
        run: make -f Makefile.e9studio CC=gcc AR=ar check

  release:
    needs: [ build-ape, run-ape ]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - name: Download APE artifacts
        uses: actions/download-artifact@v4
        with:
          name: e9studio-ape

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        with:
          files: e9studio.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
